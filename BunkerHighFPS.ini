; BunkerHighFPS - raises the game update rate of Amnesia: The Bunker above the menu's 120.
; Keep this file next to BunkerHighFPS.asi.

[General]
; 1 = active, 0 = game unmodified.
bEnabled=1

[Simulation]
; Game updates per second. The engine uses this in place of the Framerate menu choice
; (Screen.RefreshRate and Engine.GameplayUpdateRate); the settings file itself is not changed.
; With the game's LimitFPS on (the default) one frame is rendered per update, so this is also
; the frame rate. Set it to the rate you play at. Range 30 to 1000.
iUpdatesPerSec=240

[Fixes]
; The physics library removes a fixed share of an object's speed on every step, so at a higher
; update rate objects lose more speed per second (they fall slower). 1 = keep the loss per second
; as it is at 60 updates per second. The unmodified game at 120 has the stronger damping.
bFixPhysicsDamping=1
